<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c111b">
<title>Trend-Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c111b;--s1:#141b29;--s2:#1b2434;--line:#243046;--tx:#eef2f8;--mut:#8c99ae;
  --pos:#3ddc97;--neg:#ff6b6b;--acc:#7aa7ff;--warn:#f5c451;
  --r:16px;--gut:16px;
  --head:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--body);
  padding:calc(env(safe-area-inset-top) + 58px) 0 calc(env(safe-area-inset-bottom) + 84px);
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}

/* Kopfzeile */
.top{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) var(--gut) 10px;background:rgba(12,17,27,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font:700 18px var(--head);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.pill{font:600 12px var(--body);padding:3px 9px;border-radius:99px;background:rgba(245,196,81,.14);color:var(--warn)}
.state{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px rgba(61,220,151,.18)}
.dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(245,196,81,.18)}

/* Ansichten */
main{max-width:720px;margin:0 auto;padding:0 var(--gut)}
.view{display:none}.view.on{display:block}
h2{font:700 20px var(--head);letter-spacing:-.01em;margin:26px 0 10px}
h2:first-child{margin-top:18px}
.sub{color:var(--mut);font-size:13px;margin:-4px 0 12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{padding:0;overflow:hidden}

/* Hero */
.hero{padding:20px 18px;background:linear-gradient(160deg,#18223a 0%,var(--s1) 70%)}
.hero .lead{color:var(--mut);font-size:13px}
.hero .name{font:700 22px/1.15 var(--head);margin:4px 0 2px;letter-spacing:-.01em}
.hero .big{font:700 44px/1.05 var(--head);letter-spacing:-.03em;margin-top:10px}
.hero .meta{color:var(--mut);font-size:13px;margin-top:6px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s2);border-radius:12px;padding:3px;gap:3px;margin:14px 0 4px}
.seg button{padding:9px 1px;border-radius:9px;color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg4{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
.seg4 button{font-size:13px}
.seg button.on{background:var(--bg);color:var(--tx)}

/* Rangliste mit Balken um die Nulllinie */
.rank{list-style:none;margin:0;padding:0}
.rank li{border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.row{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr auto;gap:2px 12px;align-items:center;padding:14px 16px}
.row:active{background:var(--s2)}
.row .no{font:700 16px var(--head);color:var(--mut);grid-row:1/3}
.row .t{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.row .v{font:700 18px var(--head);text-align:right;letter-spacing:-.01em}
.row .s{color:var(--mut);font-size:12.5px;text-align:right}
.row .bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--s2);position:relative;margin-top:8px}
.row .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.row .bar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mut);opacity:.5}
.rank li:first-child .no{color:var(--warn)}

/* Kacheln */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{color:var(--mut);font-size:12.5px}
.tile .v{font:700 22px/1.2 var(--head);letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}

/* Diagramm */
.chart{display:block;width:100%;height:auto}
.chart polyline{vector-effect:non-scaling-stroke;fill:none;stroke-linejoin:round;stroke-linecap:round}
.cap{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px var(--gut) 10px;margin:0 calc(-1 * var(--gut));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#0b1220}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.leg{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--s2);font-size:13px;text-align:left}
.leg span{line-height:1.2;overflow-wrap:anywhere}
.leg i{flex:none;width:9px;height:9px;border-radius:50%}
.leg.off{opacity:.35}

/* Listen */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .l{min-width:0}
.list .l b{display:block;font-weight:600}
.list .l span{color:var(--mut);font-size:12.5px}
.list .r{text-align:right;white-space:nowrap}
.tag{display:inline-block;font:600 11.5px var(--body);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:1px}
.tag.long{background:rgba(61,220,151,.14);color:var(--pos)}
.tag.short{background:rgba(255,107,107,.14);color:var(--neg)}
.empty{padding:22px 16px;color:var(--mut);text-align:center}
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.years div{background:var(--s2);border-radius:12px;padding:9px 10px}
.years span{display:block;color:var(--mut);font-size:12px}
.years b{font:700 16px var(--head)}

/* Schaltflächen */
.btn{min-height:46px;padding:0 16px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-weight:600;width:100%}
.btn.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.4);color:var(--neg)}
.btn.small{min-height:36px;width:auto;padding:0 12px;font-size:13.5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.actions .wide{grid-column:1/3}
.log{font:12.5px/1.6 ui-monospace,Menlo,monospace;color:var(--mut);overflow-wrap:anywhere}
details{color:var(--mut);font-size:13.5px}
summary{cursor:pointer;padding:2px 0;color:var(--tx);font-weight:600}

/* Untere Navigation */
nav{position:fixed;inset:auto 0 0 0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:rgba(12,17,27,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;color:var(--mut);font-size:12px;font-weight:600;border-radius:12px}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
@media (min-width:720px){body{font-size:16px}.tiles{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:no-preference){.view.on{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>

<header class="top">
  <div class="brand">Trend-Bot <span class="pill">Paper</span></div>
  <div class="state"><i class="dot" id="dot"></i><span id="stat">lädt</span></div>
</header>
<main>
  <section class="view on" id="v-home"></section>

/* Liniendiagramm: Reihen mit Punkten [x, y], optionale Nulllinie */
function chart(series, base, h, opt){
  opt = opt || {};
  var W = 600, PH = h || 170, H = PH + 28, x0 = 1e18, x1 = -1e18, y0 = 1e18, y1 = -1e18;
  series.forEach(function(s){ s.pts.forEach(function(p){ x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }); });
  if (x0 > x1) return '<div class="empty">Noch keine Daten</div>';
  if (base !== null) { y0 = Math.min(y0, base); y1 = Math.max(y1, base); }
  var sx = (x1 - x0) || 1, sy = (y1 - y0) || 1, pad = 8, o = '';
  var X = function(x){ return ((x - x0) / sx) * W; };
  (opt.bands || []).forEach(function(b){                                   // investierte Zeiträume
    var a = Math.max(b[0], x0), e = Math.min(b[1], x1);
    if (e <= a) return;
    o += '<rect x="'+X(a).toFixed(1)+'" y="0" width="'+Math.max(1.5, X(e) - X(a)).toFixed(1)+'" height="'+PH+'" fill="var(--acc)" fill-opacity=".10"/>';
  });
  var ms = opt.days ? 86400000 : 1000, t0 = x0 * ms, t1 = x1 * ms, span = (t1 - t0) / 86400000, ticks = [];
  var d = new Date(t0), mon = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  if (span > 700) { for (var y = d.getUTCFullYear() + 1; Date.UTC(y, 0, 1) <= t1; y++) ticks.push([Date.UTC(y, 0, 1), String(y)]); }
  else if (span > 75) { var m0 = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1)), stepM = span > 300 ? 3 : 1;
    for (var t = m0; t.getTime() <= t1; t = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + stepM, 1))) ticks.push([t.getTime(), mon[t.getUTCMonth()] + (t.getUTCMonth() == 0 || ticks.length == 0 ? ' ' + String(t.getUTCFullYear()).slice(2) : '')]); }
  else if (span > 2) { var stepD = span > 30 ? 7 : span > 10 ? 2 : 1, dd = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 1));
    for (var t2 = dd; t2.getTime() <= t1; t2 = new Date(t2.getTime() + stepD * 86400000)) ticks.push([t2.getTime(), t2.getUTCDate() + '.' + (t2.getUTCMonth() + 1) + '.']); }
  else { var hh = Math.ceil(t0 / 21600000) * 21600000;
    for (var t3 = hh; t3 <= t1; t3 += 21600000) { var z = new Date(t3); ticks.push([t3, z.getHours() == 0 || ticks.length == 0 ? z.getDate() + '.' + (z.getMonth() + 1) + '. ' + z.getHours() + 'h' : z.getHours() + 'h']); } }
  if (ticks.length > 9) { var k = Math.ceil(ticks.length / 8); ticks = ticks.filter(function(_, i){ return i % k == 0; }); }
  ticks.forEach(function(t){
    var tx = X(t[0] / ms);
    o += '<line x1="'+tx.toFixed(1)+'" x2="'+tx.toFixed(1)+'" y1="0" y2="'+PH+'" stroke="#8c99ae" stroke-opacity=".14"/>';
    o += '<text x="'+tx.toFixed(1)+'" y="'+(PH + 23)+'" fill="#8c99ae" font-size="19" text-anchor="'+(tx < 30 ? 'start' : tx > W - 30 ? 'end' : 'middle')+'">'+t[1]+'</text>';
  });
  if (base !== null) { var yb = PH - pad - ((base - y0) / sy) * (PH - 2 * pad); o += '<line x1="0" x2="'+W+'" y1="'+yb+'" y2="'+yb+'" stroke="#8c99ae" stroke-opacity=".45" stroke-dasharray="3 5"/>'; }
  series.forEach(function(s){
    if (s.pts.length < 2) return;
    var p = s.pts.map(function(q){ return X(q[0]).toFixed(1) + ',' + (PH - pad - ((q[1] - y0) / sy) * (PH - 2 * pad)).toFixed(1); }).join(' ');
    o += '<polyline fill="none" stroke="'+s.color+'" stroke-width="'+(s.w || 2)+'" points="'+p+'"/>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+o+'</svg>';
}

  h += optCard();
  var bt = CMP.backtest;
  h += '<div class="card"><details'+(CALC_OPEN ? ' open' : '')+' ontoggle="CALC_OPEN=this.open"><summary>So ist gerechnet</summary><p>'+(CMP.running ? 'Der Backtest läuft gerade. '+esc(CMP.progress || '') : bt && bt.error ? 'Backtest-Fehler: '+esc(bt.error) : bt ? esc(bt.coins+' Coins, '+bt.days+' Tage seit '+bt.start+'. '+bt.note) : 'Backtest noch nicht fertig.')+'</p>';
  h += '<p>Der Paper-Test läuft in Echtzeit mit Spielgeld. Der Backtest rechnet dieselben Regeln auf alten Kursen. Short-Positionen sind nur simuliert, weil Pionex sie per API nicht anbietet.</p></details></div>';
  h += '<button class="btn" onclick="startBt()"'+(CMP.running ? ' disabled style="opacity:.6"' : '')+'>'+(CMP.running ? 'Backtest läuft, noch ca. '+((CMP.eta || {}).eta || '?')+' Min' : 'Backtest neu starten')+'</button>';
  $('v-home').innerHTML = h;
}

/* ---------------------------------------------------------------- Strategien */
function renderStrat(){
  var el = $('v-strat'), c = CMP;
  var keep = el.querySelector('.chips'), sl = keep ? keep.scrollLeft : 0;
  if (!c) { el.innerHTML = '<div class="empty">Daten werden geladen</div>'; return; }
  var b = c.backtest && !c.backtest.error ? c.backtest.results : null;
  var h = '<h2>Strategien im Vergleich</h2><div class="chips"><button class="chip '+(SEL == 'ALL' ? 'on' : '')+'" onclick="SEL=\'ALL\';render()">Alle</button>';
  KEYS.forEach(function(k){ if (c.forward.some(function(x){ return x.key == k; })) h += '<button class="chip '+(SEL == k ? 'on' : '')+'" onclick="SEL=\''+k+'\';try{localStorage.setItem(\'sel\',\''+k+'\')}catch(e){};render()">'+(k == 'ORIG' ? 'Hauptbot' : k)+'</button>'; });
  h += '</div>';
  if (SEL == 'ALL') {
    h += '<div class="seg" style="margin-top:0"><button class="'+(CH == 'paper' ? 'on' : '')+'" onclick="setCh(\'paper\')">Paper-Test</button><button class="'+(CH == 'bt' ? 'on' : '')+'" onclick="setCh(\'bt\')">Backtest</button></div>';
    var ser = [];
    c.forward.forEach(function(x){
      if (HIDDEN[x.key]) return;
      if (CH == 'paper') ser.push({color: COL[x.key], pts: pctSeries(x.curve, c.start), w: x.key == 'ORIG' ? 2.6 : 1.8});
      else if (b && b[x.key]) ser.push({color: COL[x.key], pts: b[x.key].curve.map(function(q){ return [q[0], (q[1] / 100 - 1) * 100]; }), w: 1.8});
    });
    h += '<div class="card" style="margin-top:12px">'+chart(ser, 0, 210, {days: CH != 'paper'})+'<div class="cap"><span>'+(CH == 'paper' ? 'Gewinn in % seit Start' : 'Gewinn in % im Backtest')+'</span><span>gestrichelt = 0 %</span></div>';
    h += '<div class="legend">'+c.forward.map(function(x){ return '<button class="leg '+(HIDDEN[x.key] ? 'off' : '')+'" onclick="toggleLine(\''+x.key+'\')"><i style="background:'+COL[x.key]+'"></i><span>'+(x.key == 'ORIG' ? 'Hauptbot' : x.key+' '+LABEL[x.key])+'</span></button>'; }).join('')+'</div></div>';
  } else {
    var x = c.forward.filter(function(z){ return z.key == SEL; })[0];
    if (x) {
      var r = b && b[x.key] ? b[x.key] : null;
      h += '<div class="card"><div style="font:700 20px var(--head);letter-spacing:-.01em">'+LABEL[x.key]+'</div><div class="mut" style="margin-top:4px">'+INFO[x.key]+'</div></div>';
      if (x.lev > 1) {
        var lq = r && r.liquidated, fq = x.liq;
        h += '<div class="card" style="border-color:'+(lq || fq ? 'var(--neg)' : 'var(--warn)')+'"><div style="font-weight:700">'+x.lev+'x Hebel: ca. '+f(100 / x.lev, 0)+' % Kursrückgang löschen das Konto</div><div class="mut" style="margin-top:4px">'
          + (r ? (lq ? 'Im Backtest wäre das Konto am '+lq+' liquidiert worden.' : 'Im Backtest wäre das Konto nicht liquidiert worden (stündlich geprüft).') : 'Backtest noch nicht fertig.')
          + (fq ? ' Im Paper-Test liquidiert am '+fmtT(fq)+'.' : '') + '</div></div>';
      }
      h += '<div class="tiles"><div class="tile"><div class="k">Paper-Konto</div><div class="v num">'+f(x.equity)+' USDT</div></div>';
      h += '<div class="tile"><div class="k">Ergebnis</div><div class="v num '+cl(x.pct)+'">'+sg(x.pct)+' %</div></div>';
      h += '<div class="tile"><div class="k">Anpassungen</div><div class="v num">'+x.rebalances+'</div></div>';
      h += '<div class="tile"><div class="k">Gebühren bisher</div><div class="v num">'+f(x.costs)+' USDT</div></div></div>';
      if (x.since) h += '<div class="mut" style="margin:-4px 0 12px">Live im Paper-Test seit '+since(x.since)+'</div>';
      h += '<div class="seg" style="margin-top:0"><button class="'+(CH == 'paper' ? 'on' : '')+'" onclick="setCh(\'paper\')">Paper-Test</button><button class="'+(CH == 'bt' ? 'on' : '')+'" onclick="setCh(\'bt\')">Backtest</button></div>';
      h += '<div class="card" style="margin-top:12px">';
      var band = '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--acc);opacity:.35;margin-right:5px;vertical-align:-1px"></span>';
      if (CH == 'paper') h += chart([{color: COL[x.key], pts: x.curve}], c.start, 190, {bands: x.investiert})+'<div class="cap"><span>Kontostand in USDT</span><span>Start '+f(c.start, 0)+'</span></div>'+(x.investiert && x.investiert.length ? '<div class="cap"><span>'+band+'hinterlegt = investiert, sonst in bar</span></div>' : '');
      else h += r ? chart([{color: COL[x.key], pts: r.curve}], 100, 190, {days: true, bands: r.investiert})+'<div class="cap"><span>Backtest, Start = 100</span><span>Ende '+f(r.final, 0)+'</span></div>'+(r.investiert ? '<div class="cap"><span>'+band+'hinterlegt = investiert, sonst in bar'+(r.investiert.length ? ' ('+r.investiert.length+' Einstiege)' : '')+'</span></div>' : '') : '<div class="empty">Backtest noch nicht fertig</div>';
      h += '</div>';
      if (r && CH == 'bt') {
        h += '<div class="tiles"><div class="tile"><div class="k">Gesamt</div><div class="v num '+cl(r.total)+'">'+sg(r.total, 0)+' %</div></div><div class="tile"><div class="k">Pro Jahr</div><div class="v num '+cl(r.cagr)+'">'+sg(r.cagr, 0)+' %</div></div>';
        h += '<div class="tile"><div class="k">Größter Rückgang</div><div class="v num neg">'+f(r.maxdd, 0)+' %</div></div><div class="tile"><div class="k">Sharpe-Wert</div><div class="v num">'+f(r.sharpe)+'</div></div>';
        h += '<div class="tile"><div class="k">Bestes Jahr</div><div class="v num '+cl(r.best_year)+'">'+sg(r.best_year, 0)+' %</div></div><div class="tile"><div class="k">Liquidiert</div><div class="v num '+((r.liquidated || r.total <= -99) ? 'neg' : 'pos')+'">'+(r.liquidated || (r.total <= -99 ? 'Konto leer' : 'nein'))+'</div></div></div>';
        h += '<h2>Ergebnis pro Jahr</h2><div class="years">'+Object.keys(r.years).map(function(y){ return '<div><span>'+y+'</span><b class="num '+cl(r.years[y])+'">'+sg(r.years[y], 0)+' %</b></div>'; }).join('')+'</div>';
      }
      h += '<h2>Offene Positionen</h2><div class="card flat"><ul class="list">';
      h += x.positions.length ? x.positions.map(function(p){ return '<li><div class="l"><b>'+(p.side == 'mix' ? esc(LABEL[p.symbol] || p.symbol) : sym(p.symbol))+sideTag(p.side)+'</b></div><div class="r num">'+f(p.value)+' USDT</div></li>'; }).join('') : '<li class="empty" style="display:block">Aktuell keine Position, das Geld liegt in bar.</li>';
      h += '</ul></div>';
    }
  }
  el.innerHTML = h;
  var nc = el.querySelector('.chips'); if (nc) nc.scrollLeft = sl;
}

/* ---------------------------------------------------------------- Hauptbot */
function renderMain(){
  var s = S, el = $('v-main');
  if (!s) { el.innerHTML = '<div class="empty">Daten werden geladen</div>'; return; }
  var left = Math.max(0, s.next_rotation - s.now), hh = Math.floor(left / 3600), mm = Math.floor((left % 3600) / 60);
  var h = '<h2>Hauptbot</h2>';
  h += '<div class="tiles"><div class="tile"><div class="k">Kontostand</div><div class="v num">'+f(s.equity)+' USDT</div></div>';
  h += '<div class="tile"><div class="k">Ergebnis</div><div class="v num '+cl(s.total_pnl)+'">'+sg(s.total_pnl / s.start * 100)+' %</div></div>';
  h += '<div class="tile"><div class="k">Freies Geld</div><div class="v num">'+f(s.cash)+' USDT</div></div>';
  h += '<div class="tile"><div class="k">Nächste Rotation</div><div class="v num">'+hh+' h '+mm+' min</div></div></div>';
  h += '<div class="card">'+chart([{color: '#3ddc97', pts: s.curve}], s.start, 170)+'<div class="cap"><span>Kontostand in USDT</span><span>'+s.trades+' Trades, '+f(s.winrate, 0)+' % im Plus</span></div></div>';
  h += '<div class="actions"><button class="btn" onclick="togglePause()">'+(s.paused ? 'Fortsetzen' : 'Pausieren')+'</button><button class="btn" onclick="act(\'/api/rotate\',\'Rotation jetzt ausführen?\')">Rotation jetzt</button>';
  h += '<button class="btn danger wide" onclick="act(\'/api/close_all\',\'Wirklich alle Positionen schließen?\')">Alle Positionen schließen</button></div>';
  h += '<h2>Offene Positionen</h2><div class="card flat"><ul class="list">';
  h += s.open.length ? s.open.map(function(p){
    return '<li><div class="l"><b>'+sym(p.symbol)+sideTag(p.side)+'</b><span class="num">Einsatz '+f(p.notional)+' · Einstieg '+f(p.entry, 4)+' · jetzt '+f(p.price, 4)+'</span></div>'
      + '<div class="r"><div class="num '+cl(p.upct)+'" style="font-weight:700">'+sg(p.upct)+' %</div><div class="num '+cl(p.upnl)+'" style="font-size:12.5px">'+sg(p.upnl)+' USDT</div>'
      + '<button class="btn small danger" style="margin-top:6px" onclick="act(\'/api/close/'+p.id+'\',\''+sym(p.symbol)+' schließen?\')">Schließen</button></div></li>'; }).join('')
    : '<li class="empty" style="display:block">Keine offene Position.</li>';
  h += '</ul></div>';
  h += '<h2>Letzte Rotation</h2><div class="sub">Coins mit der größten 24-Stunden-Bewegung. Zwei von drei Zeiträumen bestimmen Long oder Short.</div><div class="card flat"><ul class="list">';
  h += s.ranking.length ? s.ranking.map(function(x){
    return '<li><div class="l"><b>'+sym(x.symbol)+sideTag(x.side)+(x.selected ? '<span class="tag" style="background:rgba(122,167,255,.16);color:var(--acc)">gewählt</span>' : '')+'</b>'
      + '<span class="num">24 h '+sg(x.c24 * 100, 1)+' % · 7 T '+sg(x.c7 * 100, 1)+' % · 30 T '+sg(x.c30 * 100, 1)+' %</span></div><div class="r num">'+f(x.price, 4)+'</div></li>'; }).join('')
    : '<li class="empty" style="display:block">Noch keine Rotation seit dem Start.</li>';
  h += '</ul></div>';
  h += '<h2>Letzte Trades</h2><div class="card flat"><ul class="list">';
  h += s.closed.length ? s.closed.slice(0, 20).map(function(p){
    return '<li><div class="l"><b>'+sym(p.symbol)+sideTag(p.side)+'</b><span>'+fmtT(p.closed)+' · '+esc(p.reason)+'</span></div><div class="r num '+cl(p.pnl)+'" style="font-weight:700">'+sg(p.pnl)+' USDT</div></li>'; }).join('')
    : '<li class="empty" style="display:block">Noch keine abgeschlossenen Trades.</li>';
  h += '</ul></div>';
  el.innerHTML = h;
}
async function togglePause(){ await api('/api/pause/'+(S.paused ? 0 : 1), 'POST'); loadAll(); }

function renderLog(){
  var v = $('v-log');
  if (!$('logbody')) {
    v.innerHTML = '<h2>Protokoll</h2><div class="card" id="ghc"><div style="font-weight:700">Claude-Zugang</div>'
      + '<div class="mut" style="margin:4px 0 10px">Der Server legt alle 30 Minuten eine Zusammenfassung im GitHub-Branch „status“ ab, damit Claude Ranking und Backtest lesen kann. Dafür hier den GitHub-Token einfügen (nur Schreibrecht für dieses Repo).</div>'
      + '<input id="ghi" type="password" autocomplete="off" placeholder="GitHub-Token einfügen" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--s1);color:inherit;font-size:16px">'
      + '<button class="chip" style="margin-top:10px" onclick="saveGh()">Speichern und prüfen</button><div id="ghm" class="mut" style="margin-top:8px"></div></div>'
      + '<div class="card"><div style="font-weight:700;margin-bottom:6px">Server</div><div id="srvbody" class="mut">Wird geladen</div></div>'
      + '<div class="card"><div class="log" id="logbody"></div></div>';
    api('/api/status/token').then(function(r){ if (r && r.set) $('ghm').textContent = 'Zugang ist eingerichtet.'; });
  }
  $('logbody').innerHTML = S ? S.logs.map(esc).join('<br>') : 'Wird geladen';
  $('srvbody').innerHTML = srvCard();
}
function srvCard(){
  var s = CMP && CMP.server; if (!s) return 'Wird geladen';
  var r = [], dot = function(ok){ return '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:'+(ok ? 'var(--pos)' : 'var(--warn)')+'"></span>'; };
  var row = function(k, v, ok){ r.push('<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)"><span>'+dot(ok)+k+'</span><span class="num" style="color:var(--tx)">'+v+'</span></div>'); };
  if (s.ram_gesamt_mb) row('Arbeitsspeicher', f(s.ram_gesamt_mb - s.ram_frei_mb, 0)+' von '+f(s.ram_gesamt_mb, 0)+' MB belegt', s.ram_frei_mb > 150);
  if (s.prozess_mb) row('Bot-Prozess', f(s.prozess_mb, 0)+' MB', true);
  if (s.last && s.kerne) row('Auslastung (15 Min)', f(s.last[2], 2)+' bei '+s.kerne+' Kern'+(s.kerne > 1 ? 'en' : ''), s.last[2] < s.kerne * 1.5);
  if (s.disk_gesamt_gb) row('Speicherplatz', f(s.disk_gesamt_gb - s.disk_frei_gb, 1)+' von '+f(s.disk_gesamt_gb, 0)+' GB belegt', s.disk_frei_gb > 5);
  var fm = s.dateien_mb || {}, tot = 0; Object.keys(fm).forEach(function(k){ tot += fm[k]; });
  if (tot) row('Datenbanken und Ergebnisse', f(tot, 0)+' MB', tot < 2000);
  var bt = CMP.backtest; if (bt && bt.duration) row('Letzter Backtest', Math.round(bt.duration / 60)+' Min Dauer', bt.duration < 4500);
  row('Strategien im Vergleich', String(CMP.forward.length), true);
  var e = CMP.last_error; if (e) r.push('<div style="padding-top:8px;color:var(--neg)">Letzter Backtest-Fehler ('+dt(e.ts)+'): '+esc(e.error)+'. Die alten Ergebnisse bleiben erhalten.</div>');
  return r.join('');
}
async function saveGh(){
  var t = $('ghi').value.trim(); if (!t) return;
  $('ghm').textContent = 'Prüfe ...';
  try {
    var r = await fetch('/api/status/token', {method: 'POST', headers: {'X-Token': TOKEN, 'Content-Type': 'application/json'}, body: JSON.stringify({token: t})});
    var j = await r.json();
    $('ghm').textContent = r.ok ? 'Gespeichert. Die erste Zusammenfassung folgt in etwa einer Minute.' : ('Fehler: ' + (j.detail || r.status));
    if (r.ok) $('ghi').value = '';
  } catch (e) { $('ghm').textContent = 'Fehler beim Senden'; }
}
var CALC_OPEN = false;
function render(){ renderHome(); renderStrat(); renderMain(); renderLog(); show(); }
async function loadState(){ var s = await api('/api/state'); if (!s) return; S = s; $('stat').textContent = s.paused ? 'pausiert' : 'läuft'; $('dot').classList.toggle('off', !!s.paused); render(); }
async function loadCmp(){ var c = await api('/api/compare'); if (!c) return; registerAuto(c); CMP = c; render(); }
function loadAll(){ loadState(); loadCmp(); }
loadAll();
setInterval(function(){ if (!document.hidden) loadState(); }, 5000);
setInterval(function(){ if (!document.hidden) loadCmp(); }, 20000);
setInterval(function(){ if (!document.hidden && CMP && CMP.running) loadCmp(); }, 5000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) loadAll(); });
</script>
</body>
</html>
