<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trend-Bot</title>
<style>
:root{--bg:#0f1318;--card:#181e26;--line:#26303b;--tx:#e6edf3;--mut:#8b98a5;--g:#2ecc71;--r:#ff5c5c;--y:#f1c40f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 12px}h2{font-size:14px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;overflow-x:auto}
.k{color:var(--mut);font-size:12px}.v{font-size:20px;font-weight:600}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}
table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
button{background:#263241;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:#2f3d50}button.d{background:#5a2323;border-color:#7a3030}
.badge{padding:2px 8px;border-radius:99px;font-size:12px;background:#263241}
.log{font:12px monospace;color:var(--mut);max-height:200px;overflow:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;background:#3a4656}.dot.on{background:var(--g)}
</style>
</head>
<body>
<h1>Trend-Bot <span id="mode" class="badge y">PAPER</span> <span id="stat" class="badge"></span></h1>
<div class="bar">
  <button id="pbtn" onclick="togglePause()">Pause</button>
  <button onclick="act('/api/rotate','Rotation jetzt ausführen?')">Rotation jetzt</button>
  <button class="d" onclick="act('/api/close_all','Wirklich ALLE Positionen schließen?')">Alle schließen</button>
</div>
<div class="grid" id="kpi"></div>
<div class="card"><h2>Gesamtranking der Strategien</h2>
<div class="bar"><button id="so1" onclick="setSort('pct')">Sortiert nach Paper-Ergebnis</button><button id="so2" onclick="setSort('bt')">Sortiert nach Backtest</button></div>
<table id="rankall"></table><div class="k" id="btnote"></div></div>
<div class="card"><h2>Strategie-Ansicht</h2><div class="bar" id="tabs" style="overflow-x:auto;flex-wrap:nowrap"></div><div id="view"></div>
<div style="margin-top:8px"><button onclick="act('/api/backtest/run','Backtest neu starten? Dauert einige Minuten.')">Backtest neu starten</button></div></div>
<div class="card"><h2>Equity-Verlauf</h2><svg id="chart" viewBox="0 0 600 120" width="100%" height="120" preserveAspectRatio="none"></svg></div>
<div class="card"><h2>Offene Positionen</h2><table id="open"></table></div>
<div class="card"><h2>Ranking der letzten Rotation</h2>
<div class="k">Sortiert nach Stärke der 24h-Bewegung. Signale: 24h, 7 Tage, 30 Tage. Mindestens 2 von 3 bestimmen Long oder Short.</div><table id="rank"></table></div>
<div class="card"><h2>Letzte Trades</h2><table id="closed"></table></div>
<div class="card"><h2>Log</h2><div class="log" id="log"></div></div>
<script>
var TOKEN=new URLSearchParams(location.search).get('t')||localStorage.getItem('tok')||'';
try{localStorage.setItem('tok',TOKEN)}catch(e){}
var S=null;
function f(x,d){if(d===undefined)d=2;return Number(x).toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d})}
function c(x){return x>=0?'g':'r'}
function sg(x,d){return (x>=0?'+':'')+f(x,d)}
function $(id){return document.getElementById(id)}
async function api(path,method){
  var r=await fetch(path,{method:method||'GET',headers:{'X-Token':TOKEN}});
  if(r.status==401){TOKEN=prompt('Dashboard-Token:')||'';try{localStorage.setItem('tok',TOKEN)}catch(e){};return null}
  return r.json();
}
async function act(p,q){if(q&&!confirm(q))return;await api(p,'POST');load()}
async function togglePause(){await api('/api/pause/'+(S.paused?0:1),'POST');load()}
function fmtT(ts){return new Date(ts*1000).toLocaleString('de-AT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function side(s){return s=='long'?'<span class="g">LONG</span>':'<span class="r">SHORT</span>'}
async function load(){
  var s=await api('/api/state');if(!s)return;S=s;
  $('stat').textContent=s.paused?'pausiert':'läuft';
  $('pbtn').textContent=s.paused?'Fortsetzen':'Pause';
  var left=Math.max(0,s.next_rotation-s.now),hh=Math.floor(left/3600),mm=Math.floor((left%3600)/60);
  var k=[['Equity',f(s.equity)+' USDT',''],['Gesamt P&L',sg(s.total_pnl)+' USDT',c(s.total_pnl)],
   ['Gesamt %',sg(s.total_pnl/s.start*100)+' %',c(s.total_pnl)],['Freies Cash',f(s.cash)+' USDT',''],
   ['Nächste Rotation','in '+hh+' h '+mm+' min',''],['Trades',s.trades+' ('+f(s.winrate,0)+' % Treffer)','']];
  $('kpi').innerHTML=k.map(function(x){return '<div class="card" style="margin:0"><div class="k">'+x[0]+'</div><div class="v '+x[2]+'">'+x[1]+'</div></div>'}).join('');
  var h='<tr><th>Symbol</th><th>Seite</th><th>Einsatz</th><th>Einstieg</th><th>Kurs</th><th>P&L %</th><th>P&L USDT</th><th></th></tr>';
  if(s.open.length){h+=s.open.map(function(p){return '<tr><td>'+p.symbol+'</td><td>'+side(p.side)+'</td><td>'+f(p.notional)+'</td><td>'+f(p.entry,4)+'</td><td>'+f(p.price,4)+'</td><td class="'+c(p.upct)+'">'+sg(p.upct)+' %</td><td class="'+c(p.upnl)+'">'+sg(p.upnl)+'</td><td><button class="d" onclick="act(\'/api/close/'+p.id+'\',\''+p.symbol+' schließen?\')">Schließen</button></td></tr>'}).join('')}
  else{h+='<tr><td colspan=8 class="k">Keine offenen Positionen</td></tr>'}
  $('open').innerHTML=h;
  var w='<tr><th>Symbol</th><th>Kurs</th><th>24h</th><th>7d</th><th>30d</th><th>Signal</th><th>Auswahl</th></tr>';
  w+=s.ranking.map(function(x){
    return '<tr><td>'+x.symbol+'</td><td>'+f(x.price,4)+'</td><td class="'+c(x.c24)+'">'+sg(x.c24*100,1)+' %</td><td class="'+c(x.c7)+'">'+sg(x.c7*100,1)+' %</td><td class="'+c(x.c30)+'">'+sg(x.c30*100,1)+' %</td><td>'+side(x.side)+' '+x.agree+'/3</td><td>'+(x.selected?'<span class="g">gewählt</span>':'')+'</td></tr>'}).join('');
  if(!s.ranking.length)w+='<tr><td colspan=7 class="k">Noch keine Rotation seit dem Start</td></tr>';
  $('rank').innerHTML=w;
  var cl='<tr><th>Zeit</th><th>Symbol</th><th>Seite</th><th>Ein</th><th>Aus</th><th>P&L</th><th>Grund</th></tr>';
  cl+=s.closed.map(function(p){return '<tr><td>'+fmtT(p.closed)+'</td><td>'+p.symbol+'</td><td>'+side(p.side)+'</td><td>'+f(p.entry,4)+'</td><td>'+f(p.exit,4)+'</td><td class="'+c(p.pnl)+'">'+sg(p.pnl)+'</td><td>'+p.reason+'</td></tr>'}).join('');
  $('closed').innerHTML=cl;
  $('log').innerHTML=s.logs.join('<br>');
  var cv=s.curve;
  if(cv.length>1){
    var ys=cv.map(function(x){return x[1]}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),sp=(mx-mn)||1;
    var pts=cv.map(function(x,i){return ((i/(cv.length-1))*600)+','+(115-((x[1]-mn)/sp)*110)}).join(' ');
    $('chart').innerHTML='<polyline fill="none" stroke="#2ecc71" stroke-width="2" points="'+pts+'"/>';
  }
}
load();setInterval(load,3000);
var CMP=null,SEL='ALL',SORT='pct';
try{SEL=localStorage.getItem('sel')||'ALL';SORT=localStorage.getItem('sort')||'pct'}catch(e){}
var COL=['#2ecc71','#e74c3c','#3498db','#f1c40f','#9b59b6','#e67e22','#1abc9c','#ecf0f1','#fd79a8','#a29bfe','#00cec9','#fab1a0'];
function c_(x){return x>=0?'g':'r'}
function setSort(k){SORT=k;try{localStorage.setItem('sort',k)}catch(e){};render()}
function pick(k){SEL=k;try{localStorage.setItem('sel',k)}catch(e){};render()}
function short(n){return n.split(':')[0]}
function lines(series,base,h){
  var W=600,H=h||140,x0=1e18,x1=-1e18,y0=1e18,y1=-1e18;
  series.forEach(function(s){s.pts.forEach(function(p){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])})});
  if(base!==null){y0=Math.min(y0,base);y1=Math.max(y1,base)}
  var sx=(x1-x0)||1,sy=(y1-y0)||1,o='';
  if(base!==null){var yb=H-5-((base-y0)/sy)*(H-10);o+='<line x1="0" x2="'+W+'" y1="'+yb+'" y2="'+yb+'" stroke="#3a4656" stroke-dasharray="4 4"/>'}
  series.forEach(function(s){
    if(s.pts.length<2)return;
    var p=s.pts.map(function(q){return (((q[0]-x0)/sx)*W).toFixed(1)+','+(H-5-((q[1]-y0)/sy)*(H-10)).toFixed(1)}).join(' ');
    o+='<polyline fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||1.6)+'" points="'+p+'"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none">'+o+'</svg>';
}
function pctSeries(cv,st){return cv.map(function(q){return [q[0],(q[1]/st-1)*100]})}
function render(){
  var c=CMP;if(!c)return;
  var b=c.backtest&&!c.backtest.error?c.backtest.results:null;
  $('btnote').textContent=c.running?('Backtest läuft ... '+(c.progress||'')):(c.backtest&&c.backtest.error?'Backtest-Fehler: '+c.backtest.error:(b?c.backtest.coins+' Coins seit '+c.backtest.start+'. '+c.backtest.note:'Backtest noch nicht fertig'));
  var rows=c.forward.map(function(x){var r=b&&b[x.key]?b[x.key]:null;return {k:x.key,name:x.name,eq:x.equity,pct:x.pct,bt:r?r.total:null,dd:r?r.maxdd:null,sh:r?r.sharpe:null,cagr:r?r.cagr:null}});
  rows.sort(function(a,z){var u=SORT=='bt'?a.bt:a.pct,v=SORT=='bt'?z.bt:z.pct;return (v===null?-1e18:v)-(u===null?-1e18:u)});
  var t='<tr><th>#</th><th>Strategie</th><th>Paper %</th><th>Backtest %</th><th>pro Jahr %</th><th>Max. Rückgang</th><th>Sharpe</th></tr>';
  t+=rows.map(function(r,i){return '<tr style="cursor:pointer" onclick="pick(\''+r.k+'\')"><td>'+(i+1)+'</td><td>'+r.name+'</td><td class="'+c_(r.pct)+'">'+sg(r.pct)+'</td><td class="'+(r.bt===null?'':c_(r.bt))+'">'+(r.bt===null?'-':sg(r.bt,0))+'</td><td>'+(r.cagr===null?'-':sg(r.cagr,0))+'</td><td>'+(r.dd===null?'-':f(r.dd,0)+' %')+'</td><td>'+(r.sh===null?'-':f(r.sh))+'</td></tr>'}).join('');
  $('rankall').innerHTML=t;
  var tabs='<button onclick="pick(\'ALL\')" style="'+(SEL=='ALL'?'background:#3a5a8a':'')+'">Alle</button>';
  tabs+=c.forward.map(function(x){return '<button onclick="pick(\''+x.key+'\')" style="white-space:nowrap;'+(SEL==x.key?'background:#3a5a8a':'')+'">'+(x.key=='ORIG'?'Hauptbot':x.key)+'</button>'}).join('');
  $('tabs').innerHTML=tabs;
  var v='';
  if(SEL=='ALL'){
    var ser=c.forward.map(function(x,i){return {color:COL[i%COL.length],pts:pctSeries(x.curve,c.start)}});
    v+='<div class="k">Paper-Verlauf aller Strategien in % seit Start (gestrichelt = 0 %)</div>'+lines(ser,0,180);
    v+='<div style="margin-top:6px">'+c.forward.map(function(x,i){return '<span style="margin-right:10px;white-space:nowrap"><span class="dot" style="background:'+COL[i%COL.length]+'"></span>'+short(x.name)+' '+sg(x.pct)+' %</span>'}).join('')+'</div>';
    if(b){var ser2=c.forward.filter(function(x){return b[x.key]}).map(function(x){var i=c.forward.indexOf(x);return {color:COL[i%COL.length],pts:b[x.key].curve}});
      v+='<div class="k" style="margin-top:12px">Backtest-Verlauf (Start = 100, Log-Skala nicht verwendet)</div>'+lines(ser2,100,180)}
  }else{
    var x=c.forward.filter(function(z){return z.key==SEL})[0];
    if(x){
      var r=b&&b[x.key]?b[x.key]:null;
      v+='<div style="font-weight:600;margin-bottom:6px">'+x.name+'</div>';
      v+='<div class="grid"><div class="card" style="margin:0"><div class="k">Equity (Paper)</div><div class="v">'+f(x.equity)+'</div></div><div class="card" style="margin:0"><div class="k">P&L</div><div class="v '+c_(x.pct)+'">'+sg(x.pct)+' %</div></div><div class="card" style="margin:0"><div class="k">Anpassungen / Kosten</div><div class="v">'+x.rebalances+' / '+f(x.costs)+'</div></div></div>';
      v+='<div class="k" style="margin-top:10px">Paper-Verlauf (Equity)</div>'+lines([{color:'#2ecc71',pts:x.curve}],c.start,140);
      v+='<div class="k" style="margin-top:10px">Offene Positionen</div><table><tr><th>Symbol</th><th>Seite</th><th>Wert</th></tr>'+(x.positions.length?x.positions.map(function(p){return '<tr><td>'+p.symbol+'</td><td>'+side(p.side)+'</td><td>'+f(p.value)+'</td></tr>'}).join(''):'<tr><td colspan=3 class="k">Keine (Cash)</td></tr>')+'</table>';
      if(r){
        v+='<div class="k" style="margin-top:10px">Backtest-Verlauf (Start = 100)</div>'+lines([{color:'#3498db',pts:r.curve}],100,140);
        v+='<div class="k" style="margin-top:6px">Gesamt '+sg(r.total,0)+' % | pro Jahr '+sg(r.cagr,0)+' % | max. Rückgang '+f(r.maxdd,0)+' % | Sharpe '+f(r.sharpe)+' | Kosten '+f(r.costs,0)+'</div>';
        v+='<table><tr>'+Object.keys(r.years).map(function(y){return '<th>'+y+'</th>'}).join('')+'</tr><tr>'+Object.keys(r.years).map(function(y){return '<td class="'+c_(r.years[y])+'">'+sg(r.years[y],0)+' %</td>'}).join('')+'</tr></table>';
      }
    }
  }
  $('view').innerHTML=v;
}
async function loadCmp(){var c=await api('/api/compare');if(!c)return;CMP=c;render()}
loadCmp();setInterval(loadCmp,30000);

</script>
</body>
</html>
